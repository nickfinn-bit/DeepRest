# Publishes the site to GitHub Pages. It only runs when started by hand
# (Actions > Publish to GitHub Pages > Run workflow), and its strict build refuses
# to build while any placeholder remains in site.config.json, so nothing can be
# published until every real detail and the Calendly link are filled in.
# One-time setting: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Publish to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build, refusing while any placeholder remains
        run: node scripts/build.mjs --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
